name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node-version: [20, 22, latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Audit dependencies (production only — see Context.md's Open Risks for the tracked dev-only exception)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Pack npm tarball
        run: npm pack

      - name: Packaging smoke test
        shell: bash
        run: |
          set -euo pipefail

          TARBALL="$(ls ./*.tgz | head -n1)"
          echo "Packed tarball: ${TARBALL}"

          SMOKE_DIR="$(mktemp -d)"
          echo "Installing packed tarball into fresh temp dir: ${SMOKE_DIR}"

          # Install the packed tarball exactly as an end user would, so this
          # also exercises the package.json "bin" wiring and preserved shebang.
          cd "${SMOKE_DIR}"
          npm install -g "${GITHUB_WORKSPACE}/${TARBALL}"

          HELP_OUTPUT="$(nh-deck --help)"
          echo "${HELP_OUTPUT}"

          if ! echo "${HELP_OUTPUT}" | grep -qiE "usage|nh-deck|render|pdf"; then
            echo "::error::'nh-deck --help' did not print recognizable help output"
            exit 1
          fi
